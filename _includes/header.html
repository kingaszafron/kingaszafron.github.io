<header>
  <nav>
    <ul>
      {% if page.url == "/" or page.url == "/index.html" %}
      <li class="current">About</li>
      {% else %}
      <a href="{{ '/' | relative_url }}">
        <li class="btn-nav">About</li>
      </a>
      {% endif %}
      {% if page.url contains "/achievements" %}
      <li class="current">Achievements</li>
      {% else %}
      <a href="{{ '/achievements/' | relative_url }}">
        <li class="btn-nav">Achievements</li>
      </a>
      {% endif %}
    </ul>
  </nav>
</header>
