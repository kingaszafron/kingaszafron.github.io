research_profile: >-
  Cognitive science graduate (BA, Jagiellonian University, 2026), currently
  a Master's student in cognitive science. My research concerns numerical
  cognition: spatial-numerical associations (the SNARC effect), their
  stability across bodily and temporal contexts, and long-term memory for
  numerical information within Fuzzy-Trace Theory. I have worked across the
  full research cycle, from study design and pre-registration through VR data
  collection to Bayesian analysis and presentation at international
  conferences.

